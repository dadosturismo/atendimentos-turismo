<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f18d09"><link rel="manifest" href="manifest.webmanifest"><title>Cadastrar atendimento</title><style>
:root{--g:#303237;--m:#344f57;--a:#f18d09;--y:#f8a231;--b:#d8ddd5;--s:#536067;--e:#be3329;--grad:linear-gradient(105deg,#f18d09,#f8a231 40%,#f18d09)}*{box-sizing:border-box}body{background:#f7f7f2;color:var(--g);font:16px Aptos,"Segoe UI",Arial,sans-serif;margin:0;padding:40px 20px}.container{background:#fffefb;border-radius:22px;box-shadow:0 18px 60px #30323721;margin:auto;max-width:900px;overflow:hidden;padding:32px;position:relative}.container:before{background:var(--grad);content:"";height:7px;inset:0 0 auto;position:absolute}.cabecalho{margin:2px auto 25px;text-align:center}.cabecalho:after{background:var(--grad);content:"";display:block;height:4px;margin:20px auto 0;max-width:560px}.logo img{max-width:min(100%,280px)}h1{font-size:clamp(1.75rem,4vw,2.5rem);margin:0;text-transform:uppercase}.instituicao{color:var(--m);font-size:.9rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase}.subtitulo,.ajuda{color:var(--s);line-height:1.5}.status{background:#edf2ef;border-radius:10px;display:flex;gap:18px;justify-content:center;margin:0 auto 22px;max-width:760px;padding:10px}.offline,.erro{color:var(--e)}.card{background:#fffefb;border:1px solid var(--a);border-radius:16px;margin:auto;max-width:760px;padding:26px}h2{color:var(--m);margin:0 0 24px}.campo,fieldset{border:0;margin:0 0 20px;padding:0}label,legend{display:block;font-weight:700;margin-bottom:8px}input,select,textarea{background:#fff;border:1px solid var(--b);border-radius:9px;font:inherit;padding:11px;width:100%}input:disabled,select:disabled{background:#e4e7e6}textarea{min-height:118px;resize:vertical}.opcoes{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}.opcao{cursor:pointer;margin:0}.opcao input{opacity:0;position:absolute}.opcao span{align-items:center;border:1px solid var(--b);border-radius:10px;color:var(--m);display:flex;font-weight:800;justify-content:center;min-height:54px;padding:10px;text-align:center}.opcao input:checked+span{background:linear-gradient(115deg,#d9f0f1,#b5e2c1);border-color:transparent}.outro{background:#fff5df;border:1px solid #f8a231;border-radius:11px;margin-top:12px;padding:14px}button{background:linear-gradient(115deg,#d9f0f1,#b5e2c1);border:0;border-radius:999px;cursor:pointer;font:inherit;font-weight:800;padding:12px 22px}button:disabled{background:#98a2b3;cursor:not-allowed}.mensagem{font-weight:600;min-height:24px}.oculto{display:none!important}@media(max-width:600px){body{padding:18px 12px}.container{padding:22px 16px}.card{padding:20px}.opcoes{grid-template-columns:1fr}button{width:100%}}
</style></head><body><main class="container"><header class="cabecalho"><a class="logo" href="https://turismo.curitiba.pr.gov.br/" target="_blank" rel="noopener"><img src="https://i.imgur.com/Nr92vCC.png" alt="Curitiba Turismo"></a><h1>Cadastrar atendimento</h1><p class="instituicao">Instituto Municipal de Turismo de Curitiba</p><p class="subtitulo">Formulário para facilitar o cadastramento de atendimento nos PITs e CATs.</p></header><div class="status"><span id="network"></span><span id="pending">Pendentes: 0</span></div><section class="card"><h2>Dados do atendimento</h2><form id="form" novalidate><div class="campo"><label for="nome">Seu nome</label><input id="nome" maxlength="160" autocomplete="name" required></div><fieldset><legend>Tipo de atendimento</legend><div class="opcoes"><label class="opcao"><input type="radio" name="tipo" value="Curitiba e Região Metropolitana"><span>Curitiba e Região Metropolitana</span></label><label class="opcao"><input type="radio" name="tipo" value="Visitante"><span>Visitante</span></label></div></fieldset><fieldset><legend>Visitante</legend><div class="opcoes"><label class="opcao"><input type="radio" name="nac" value="Brasileiro"><span>Brasileiro</span></label><label class="opcao"><input type="radio" name="nac" value="Estrangeiro"><span>Estrangeiro</span></label></div></fieldset><div class="campo"><label for="pais">País de origem</label><select id="pais" required disabled></select><p class="ajuda">As opções ficam disponíveis offline após o primeiro acesso online.</p></div><div class="campo"><label for="estado">Estado de origem</label><select id="estado" disabled></select></div><div class="campo"><label for="info">Informação solicitada</label><select id="info" required disabled></select><div id="outroBox" class="outro oculto"><label for="outro">Descreva a informação solicitada</label><input id="outro" maxlength="500"></div></div><div class="campo"><label for="obs">Observações <span class="ajuda">(opcional)</span></label><textarea id="obs" maxlength="3000"></textarea></div><button id="save" type="submit" disabled>Computar atendimento</button><p id="msg" class="mensagem" role="alert"></p></form></section><iframe id="bridge" name="bridge" class="oculto"></iframe></main><script src="app.js"></script></body></html>
