<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><title>Cadastrar atendimento</title>
<style>
:root{--verde:#237a3b;--cinza:#98a2b3;--borda:#d8ddd5;--laranja:#f18d09}*{box-sizing:border-box}body{background:#f7f7f2;color:#303237;font:16px Arial;margin:0;padding:25px}.box{background:#fff;border-radius:20px;box-shadow:0 10px 35px #0002;max-width:900px;margin:auto;padding:30px;border-top:7px solid var(--laranja)}header{text-align:center;border-bottom:4px solid var(--laranja);margin-bottom:20px}.logo{max-width:280px}.status{display:flex;justify-content:center;gap:20px;padding:10px;background:#edf2ef;border-radius:10px;margin-bottom:20px}.online{color:var(--verde);font-weight:bold}.offline,.erro{color:#be3329}.card{border:1px solid var(--laranja);border-radius:15px;max-width:760px;margin:auto;padding:25px}.campo,fieldset{border:0;padding:0;margin:0 0 18px}label,legend{font-weight:bold;display:block;margin-bottom:7px}input,select,textarea,button{box-sizing:border-box;width:100%;padding:11px;border:1px solid var(--borda);border-radius:8px;font:inherit}textarea{min-height:110px}.opcoes{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opcao{border:1px solid var(--borda);padding:12px;border-radius:8px}.opcao input{width:auto}.opcao:has(input:checked){background:linear-gradient(115deg,#d9f0f1,#b5e2c1);border-color:#79b58b}.linha{display:flex;gap:10px;align-items:end}.linha .campo{flex:1}.mini{width:auto;white-space:nowrap;margin-bottom:18px;background:#d9f0f1}.outro{background:#fff5df;padding:12px;border-radius:8px;margin-top:10px}.oculto{display:none!important}.mensagem{min-height:24px;font-weight:bold}#nome.nome-salvo{background:transparent;border-color:transparent;box-shadow:none;color:var(--verde);font-weight:700;padding-left:0}#save{background:var(--verde);color:#fff;border:0;font-weight:bold}#save:disabled{background:var(--cinza);color:#fff;cursor:not-allowed}@media(max-width:600px){.opcoes{grid-template-columns:1fr}.linha{display:block}.mini{width:100%;margin-bottom:10px}}</style></head>
<body><main class="box"><header><img class="logo" src="https://i.imgur.com/Nr92vCC.png" alt="Curitiba Turismo"><h1>CADASTRAR ATENDIMENTO</h1><p>INSTITUTO MUNICIPAL DE TURISMO DE CURITIBA</p><p>Formulário para facilitar o cadastramento de atendimento nos PITs e CATs.</p></header><div class="status"><span id="network"></span><span id="pending">Pendentes: 0</span></div><section class="card"><h2>Dados do atendimento</h2><form id="form"><div class="linha"><div class="campo"><label>Selecione o atrativo</label><select id="atrativo" required disabled></select></div><button id="alterarAtrativo" type="button" class="mini oculto">Alterar atrativo</button></div><div class="linha"><div class="campo"><label>Seu nome</label><input id="nome" required></div><button id="alterarNome" type="button" class="mini">Trocar nome</button></div><fieldset><legend>Tipo de atendimento</legend><div class="opcoes"><label class="opcao"><input type="radio" name="tipo" value="Curitiba e Região Metropolitana"> Curitiba e Região Metropolitana</label><label class="opcao"><input type="radio" name="tipo" value="Visitante"> Visitante</label></div></fieldset><fieldset><legend>Visitante</legend><div class="opcoes"><label class="opcao"><input type="radio" name="nac" value="Brasileiro"> Brasileiro</label><label class="opcao"><input type="radio" name="nac" value="Estrangeiro"> Estrangeiro</label></div></fieldset><div class="campo"><label>País de origem</label><select id="pais" required disabled></select></div><div class="campo"><label>Estado de origem</label><select id="estado" disabled></select></div><div class="campo"><label>Informação solicitada</label><select id="info" required disabled></select><div id="outroBox" class="outro oculto"><label>Descreva a informação solicitada</label><input id="outro"></div></div><div id="grupoBox" class="campo oculto"><label>Quantas pessoas no grupo atendido?</label><input id="grupo" type="number" min="1" max="100"></div><div class="campo"><label>Observações (opcional)</label><textarea id="obs"></textarea></div><button id="save" disabled>Computar atendimento</button><p id="msg" class="mensagem"></p></form></section><iframe id="bridge" name="bridge" class="oculto"></iframe></main><script src="app.js"></script></body></html>
