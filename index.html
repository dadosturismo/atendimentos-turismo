<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f18d09"><link rel="manifest" href="manifest.webmanifest"><title>Cadastrar atendimento</title><style>
:root{--c:#344f57;--a:#f18d09;--b:#d8ddd5;--e:#be3329}*{box-sizing:border-box}body{margin:0;background:#f7f7f2;color:#303237;font:16px Aptos,Segoe UI,Arial,sans-serif;padding:20px}main{max-width:760px;margin:auto;background:#fffefb;border-radius:16px;padding:26px;box-shadow:0 10px 28px #3032371c;border-top:7px solid var(--a)}h1,h2{color:var(--c)}.status{display:flex;gap:12px;flex-wrap:wrap;padding:10px 12px;background:#edf2ef;border-radius:9px;margin:0 0 22px}.offline{color:var(--e)}.field,fieldset{border:0;padding:0;margin:0 0 18px}label,legend{font-weight:700;display:block;margin-bottom:7px}input,select,textarea,button{font:inherit;width:100%;padding:11px;border:1px solid var(--b);border-radius:9px}textarea{min-height:100px}button{border:0;background:var(--a);color:white;font-weight:bold;cursor:pointer;margin-top:5px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choices label{border:1px solid var(--b);border-radius:9px;padding:10px;margin:0}.choices input{width:auto}.hide{display:none!important}.msg{min-height:24px;font-weight:600}.error{color:var(--e)}.ok{color:#287832}@media(max-width:520px){body{padding:12px}.choices{grid-template-columns:1fr}}
</style></head><body><main><h1>Cadastrar atendimento</h1><p>Instituto Municipal de Turismo de Curitiba</p><div class="status"><span id="network"></span><span id="pending">Pendentes: 0</span></div><form id="form" novalidate><div class="field"><label>Seu nome <input id="nome" maxlength="160" required autocomplete="name"></label></div><fieldset><legend>Tipo de atendimento</legend><div class="choices"><label><input type="radio" name="tipo" value="Curitiba e Região Metropolitana"> Curitiba e Região Metropolitana</label><label><input type="radio" name="tipo" value="Visitante"> Visitante</label></div></fieldset><fieldset><legend>Visitante</legend><div class="choices"><label><input type="radio" name="nac" value="Brasileiro"> Brasileiro</label><label><input type="radio" name="nac" value="Estrangeiro"> Estrangeiro</label></div></fieldset><div class="field"><label>País de origem <select id="pais" required disabled></select></label></div><div class="field"><label>Estado de origem <select id="estado" disabled></select></label></div><div class="field"><label>Informação solicitada <select id="info" required disabled></select></label></div><div id="outroBox" class="field hide"><label>Descreva a informação solicitada <input id="outro" maxlength="500"></label></div><div class="field"><label>Observações (opcional)<textarea id="obs" maxlength="3000"></textarea></label></div><button id="save" disabled>Computar atendimento</button><p id="msg" class="msg" role="alert"></p></form><iframe id="bridge" name="bridge" class="hide"></iframe></main><script src="app.js"></script></body></html>
